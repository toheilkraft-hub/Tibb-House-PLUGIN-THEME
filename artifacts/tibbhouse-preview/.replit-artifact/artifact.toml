kind = "web"
previewPath = "/"
title = "Tibb House Preview"
version = "1.0.0"
id = "artifacts/tibbhouse-preview"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21881

[services.development]
run = "pnpm --filter @workspace/tibbhouse-preview run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tibbhouse-preview", "run", "build" ]
serve = "static"
publicDir = "artifacts/tibbhouse-preview/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21881"
BASE_PATH = "/"
